project_id = "xe-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "8MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/reset-password", "http://localhost:5173/reset-password"]
jwt_expiry = 3600
# Global signup endpoint is disabled; accounts are created via Auth Admin/manage-users only.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# IMPORTANT: this flag controls the email PROVIDER (logins included), not only
# public signup. Setting it false breaks username->email password sign-in.
# Public signup stays blocked through the global [auth] enable_signup = false.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

# Edge Function deployment policy (see docs/PRODUCTION_RELEASE.md):
# - Production deploys MUST name functions explicitly (never `--all`).
# - `reset-owner` is retired (returns HTTP 410) and must never be deployed.
# - `ai-assist` is optional and must not block the CRM release; it stays
#   undeployed until server-side provider secrets are approved.
[functions.manage-users]
verify_jwt = true

[functions.process-message]
verify_jwt = true

[functions.ai-assist]
verify_jwt = true
